<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html,body{height:100%}
/* Глубокий космическо-пещерный фон */
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#dfe6f2;overflow:auto;
  background:radial-gradient(circle at 50% 35%,#0d1e38 0%,#050b14 75%) fixed}
.col{width:96vw;max-width:430px;margin:0 auto;padding:16px 0 40px;position:relative;z-index:2}

/* ===== ШАПКА ===== */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-style:italic;font-weight:900;font-size:26px;letter-spacing:.5px;cursor:pointer;
  user-select:none;text-shadow:0 0 14px rgba(60,160,255,.55)}
.logo .w{color:#fff}
.logo .b{color:#2f9beb}
.switch{background:linear-gradient(180deg,#3b9df0,#1f7fd6);border:none;border-radius:10px;
  padding:10px 16px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(40,130,240,.35)}
.switch:active{transform:scale(.97)}

/* ===== СТАТУС-СТРОКА ===== */
.status{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0 12px;
  font-size:13px;font-weight:800;letter-spacing:1.6px}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.1s infinite}
.status.idle{color:#8b93a7}
.status.an{color:#4fc3f7}
.status.ok{color:#2ee56e}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* ===== ДВОЙНАЯ НЕОНОВАЯ РАМКА ПОЛЯ + ПАРЯЩИЕ КРИСТАЛЛЫ ===== */
.board-wrap{position:relative;width:max-content;margin:0 auto;padding:10px;
  background:#081426;
  border:1.5px solid #00c8ff;
  border-radius:20px;
  box-shadow:0 0 25px rgba(0,200,255,0.35),inset 0 0 15px rgba(0,150,255,0.15)}
/* Левый кристалл-осколок: компактный, у самой грани рамки */
.board-wrap::before{
  content:'';position:absolute;left:-26px;top:24%;width:20px;height:46px;--r:12deg;
  background:linear-gradient(135deg,#e0faff 0%,#00d2ff 60%,#006699 100%);
  clip-path:polygon(50% 0,78% 28%,64% 55%,100% 78%,58% 100%,42% 68%,0 52%,30% 30%);
  filter:drop-shadow(0 0 10px rgba(0,220,255,0.8));
  opacity:0.85;
  animation:float 3.5s ease-in-out infinite}
/* Правый кристалл-осколок: компактный, у самой грани рамки */
.board-wrap::after{
  content:'';position:absolute;right:-26px;top:50%;width:18px;height:44px;--r:-14deg;
  background:linear-gradient(135deg,#e0faff 0%,#00d2ff 60%,#006699 100%);
  clip-path:polygon(50% 0,80% 30%,62% 52%,100% 76%,56% 100%,40% 66%,0 50%,32% 28%);
  filter:drop-shadow(0 0 10px rgba(0,220,255,0.8));
  opacity:0.85;
  animation:float 3.5s ease-in-out infinite;animation-delay:1.7s}
@keyframes float{
  0%,100%{transform:rotate(var(--r)) translateY(0)}
  50%{transform:rotate(var(--r)) translateY(-6px)}
}
.board{width:290px;height:290px;display:grid;grid-template-columns:repeat(5,52px);
  grid-template-rows:repeat(5,52px);gap:6px;justify-content:center;align-content:center;margin:0 auto}

/* ===== ЯРКО-ГОЛУБЫЕ НЕОНОВЫЕ ПЛИТКИ ===== */
.cell{width:52px;height:52px;min-width:52px;min-height:52px;border-radius:12px;overflow:hidden;
  background:radial-gradient(circle at 50% 25%,#2be4ff 0%,#00a8d6 55%,#00688a 100%);
  border:1px solid rgba(0,0,0,.4);
  border-top:1.5px solid #a6f4ff;
  box-shadow:inset 0 -3px 5px rgba(0,30,50,0.8),0 3px 6px rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center}
.cell.scan{filter:brightness(1.8);box-shadow:0 0 12px rgba(120,220,255,.9)}
/* Открытая ячейка — просто тёмная ниша, без окантовки */

/* Иконки крупные: 88% клетки */
.cell.open svg{
  width:88%;height:88%;display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));
  animation:popIn 0.25s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
.cell.boom svg{
  width:88%;height:88%;display:block;
  filter:drop-shadow(0 0 6px rgba(90,210,255,.5));
  animation:popIn 0.25s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@media (max-width:340px){.board-wrap{transform:scale(.86);transform-origin:top center;margin-bottom:-40px}}

/* ===== НИЖНИЕ ПАНЕЛИ ===== */
.panel{margin-top:12px;border-radius:14px;background:#141a24;display:flex;align-items:center;
  justify-content:center;padding:10px 12px;gap:10px}
/* Селектор ловушек: отзывчивые стрелки, gap 20px */
.sel{display:flex;align-items:center;gap:20px;background:#0d1219;border-radius:12px;padding:8px 20px}
.sel button{background:none;border:none;color:#8b93a7;font-size:20px;cursor:pointer;line-height:1;
  padding:6px 12px;border-radius:8px;transition:transform .08s}
.sel button:active{color:#fff;background:rgba(80,150,255,.18);transform:scale(.9)}
.sel b{color:#fff;font-size:16px;min-width:16px;text-align:center}
.sel small{color:#8b93a7;font-size:12px;font-weight:600}

/* ===== КНОПКИ: Play широкая, Back компактная под ней ===== */
.controls{margin-top:12px;border-radius:14px;background:#141a24;padding:12px}
.play{display:block;width:100%;height:42px;background:#0077ff;border:none;border-radius:10px;
  color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,119,255,.35)}
.play:active{transform:scale(.98)}
.back{display:block;width:90px;height:32px;background:#962d18;border:none;border-radius:8px;
  color:#ffd9c9;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;margin:10px auto 0}
.back:active{transform:scale(.96)}

/* ===== БЕЙДЖ АДМИНА ===== */
.badge{position:fixed;top:8px;right:8px;z-index:130;background:rgba(255,180,0,.15);border:1px solid #ffb400;
  color:#ffd76a;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700}
</style>
</head>

<script>
var tg = window.Telegram ? Telegram.WebApp : null;

var FORCE = new URLSearchParams(location.search).get('admin') === '1';
if (FORCE) document.getElementById('adminBadge').hidden = false;

/* ---------- Виброотклик Telegram ---------- */
function hapticLight(){
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
    try { window.Telegram.WebApp.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
}
function hapticSuccess(){
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
    try { window.Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }
}

/* ---------- SVG-ассеты ---------- */

var STAR_SVG =
'<svg viewBox="0 0 100 100">' +
'<polygon points="50,2 61.8,33.8 95.7,35.2 69,56.2 78.2,88.8 50,70 21.8,88.8 31,56.2 4.3,35.2 38.2,33.8" fill="url(#sg)" stroke="#b23b10" stroke-width="3" stroke-linejoin="round"/>' +
'<polygon points="50,50 50,2 61.8,33.8" fill="rgba(160,40,5,.4)"/>' +
'<polygon points="50,50 95.7,35.2 69,56.2" fill="rgba(160,40,5,.4)"/>' +
'<polygon points="50,50 78.2,88.8 50,70" fill="rgba(160,40,5,.4)"/>' +
'<polygon points="50,50 21.8,88.8 31,56.2" fill="rgba(160,40,5,.4)"/>' +
'<polygon points="50,50 4.3,35.2 38.2,33.8" fill="rgba(160,40,5,.4)"/>' +
'<polygon points="50,50 50,2 38.2,33.8" fill="rgba(255,240,200,.35)"/>' +
'<polygon points="50,50 95.7,35.2 61.8,33.8" fill="rgba(255,240,200,.35)"/>' +
'<polygon points="50,50 78.2,88.8 69,56.2" fill="rgba(255,240,200,.35)"/>' +
'<polygon points="50,50 21.8,88.8 50,70" fill="rgba(255,240,200,.35)"/>' +
'<polygon points="50,50 4.3,35.2 31,56.2" fill="rgba(255,240,200,.35)"/>' +
'</svg>';

/* Ледяной крест со стеклянными гранями */
var CROSS_SVG = '<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#a8f0ff"/><stop offset="70%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/></linearGradient></defs><g transform="rotate(45 50 50)" stroke="#024e7a" stroke-width="1.5"><rect x="38" y="8" width="24" height="84" rx="12" fill="url(#ice)"/><rect x="8" y="38" width="84" height="24" rx="12" fill="url(#ice)"/><rect x="44" y="14" width="12" height="72" rx="6" fill="#fff" opacity="0.65"/><rect x="14" y="44" width="72" height="12" rx="6" fill="#fff" opacity="0.65"/></g></svg>';

/* ---------- DOM / состояние ---------- */
var cells=Array.prototype.slice.call(document.getElementById('board').children);
var playBtn=document.getElementById('playBtn');
var switchBtn=document.getElementById('switchBtn');
var traps=1, busy=false, multi=false;
var PICKS_MIN=3, PICKS_MAX=5;

function $(id){return document.getElementById(id);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

function setStatus(st){
  $('status').className='status '+st;
  $('statusTxt').textContent = st==='an' ? 'ANALISANDO IA...' : (st==='ok' ? 'SINAL PRONTO ✅' : 'AGUARDANDO COMANDO...');
}

/* Селектор мин: отзывчивые стрелки + вибро */
$('tMinus').onclick=function(){traps=Math.max(1,traps-1);$('trapVal').textContent=traps;hapticLight();};
$('tPlus').onclick=function(){traps=Math.min(24,traps+1);$('trapVal').textContent=traps;hapticLight();};

/* Switch to multiple / single */
switchBtn.onclick=function(){
  multi=!multi;
  switchBtn.textContent=multi?'Switch to single':'Switch to multiple';
  beep(multi?880:520,.08,'triangle',.1);
  hapticLight();
};

/* ---------- Звук: Web Audio API ---------- */
var AC=null;
function beep(f,t,type,g,when){
  t=t0.12;type=type'sine';g=(g===undefined)?0.15:g;when=when||0;
  try{
    AC=ACnew (window.AudioContextwindow.webkitAudioContext)();

}
function chime(){[660,880,1188].forEach(function(f,i){beep(f,.18,'triangle',.18,i*.09);});}

/* ---------- Раунд ---------- */
function clearBoard(){cells.forEach(function(c){c.className='cell';c.innerHTML='';});}

playBtn.onclick=async function(){
  if(busy)return; busy=true;
  clearBoard();
  setStatus('an'); hapticLight();

  /* Сканирование ~1.6 c */
  var tickN=0;
  var iv=setInterval(function(){
    var c=cells[Math.floor(Math.random()*25)];
    c.classList.add('scan');setTimeout(function(){c.classList.remove('scan');},140);
    tickN++;if(tickN%2)beep(1400,.03,'square',.03);
  },70);
  await sleep(1600); clearInterval(iv);

  /* Расстановка ловушек (Force → углы 1,5,21,25 всегда безопасны) */
  var corners=[0,4,20,24];
  var pool=[];for(var i=0;i<25;i++){if(!(FORCE&&corners.indexOf(i)>=0))pool.push(i);}
  shuffle(pool);
  var trapSet=pool.slice(0,traps);
  var safe=[];for(var s2=0;s2<25;s2++){if(trapSet.indexOf(s2)<0)safe.push(s2);}

  if(multi){
    /* MULTIPLE: всё поле — звёзды + ледяные кресты по числу traps */
    for(var x=0;x<25;x++){
      (function(idx){setTimeout(function(){
        var c=cells[idx];

        else{c.classList.add('open');c.innerHTML=STAR_SVG;}

      },idx*28);})(x);
    }
    await sleep(25*28+350);
  }else{
    /* SINGLE: 3–5 сигнальных звёзд (Force → строго углы 1,5,21,25) */
    var n=PICKS_MIN+Math.floor(Math.random()*(PICKS_MAX-PICKS_MIN+1));
    var stars=FORCE?corners:shuffle(safe.slice()).slice(0,n);
    for(var k=0;k<stars.length;k++){
      await sleep(150);
      var c=cells[stars[k]];
      c.classList.add('open');c.innerHTML=STAR_SVG;
      beep(980+k*120,.09,'triangle',.12);
      hapticLight(); /* вибро на открытии каждой ячейки */
    }
  }

  chime(); hapticSuccess();

  busy=false;
};

/* Back: сброс поля + возврат в бот */
$('backBtn').onclick=function(){
  if(busy)return;
  clearBoard();
  setStatus('idle');
  beep(420,.1,'triangle',.1);
  hapticLight();
  if(tg){try{tg.close();}catch(e){}}
};

setStatus('idle');
</script>
