<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050b14">
<title>Mines — Sinais IA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
*::before,*::after{pointer-events:none}
html,body{height:100%;user-select:none;-webkit-user-select:none}
body{
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
  color:#dfe6f2;
  overflow-x:hidden;
  background:radial-gradient(circle at 50% 35%,#0d1e38 0%,#050b14 75%) fixed;
}
.col{
  width:96vw;
  max-width:430px;
  margin:0 auto;
  padding:16px 0 40px;
  position:relative;
  z-index:2;
}

/* КНОПКИ */
button{
  cursor:pointer;
  touch-action:manipulation;
  position:relative;
  z-index:99;
}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{
  font-style:italic;
  font-weight:900;
  font-size:26px;
  letter-spacing:.5px;
  user-select:none;
  text-shadow:0 0 14px rgba(60,160,255,.55);
}
.logo .w{color:#fff}
.logo .b{color:#2f9beb}
.switch{
  background:linear-gradient(180deg,#3b9df0,#1f7fd6);
  border:none;
  border-radius:10px;
  padding:10px 16px;
  color:#fff;
  font-size:13px;
  font-weight:700;
  box-shadow:0 4px 14px rgba(40,130,240,.35);
}
.switch:active{transform:scale(.97)}

/* STATUS BAR */
.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  margin:2px 0 12px;
  font-size:13px;
  font-weight:800;
  letter-spacing:1.6px;
}
.status .dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
  animation:pulse 1.1s infinite;
}
.status.idle{color:#8b93a7}
.status.an{color:#4fc3f7}
.status.ok{color:#2ee56e}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* BOARD WRAP + CRYSTALS */
.board-wrap{
  position:relative;
  width:max-content;
  margin:0 auto;
  padding:10px;
  background:#081426;
  border:1.5px solid #00c8ff;
  border-radius:20px;
  box-shadow:0 0 25px rgba(0,200,255,0.35),inset 0 0 15px rgba(0,150,255,0.15);
}
.board-wrap::before{
  content:'';
  position:absolute;
  left:-26px;
  top:24%;
  width:20px;
  height:46px;
  --r:12deg;
  background:linear-gradient(135deg,#e0faff 0%,#00d2ff 60%,#006699 100%);
  clip-path:polygon(50% 0,78% 28%,64% 55%,100% 78%,58% 100%,42% 68%,0 52%,30% 30%);
  filter:drop-shadow(0 0 10px rgba(0,220,255,0.8));
  opacity:0.85;
  animation:float 3.5s ease-in-out infinite;
}
.board-wrap::after{
  content:'';
  position:absolute;
  right:-26px;
  top:50%;
  width:18px;
  height:44px;
  --r:-14deg;
  background:linear-gradient(135deg,#e0faff 0%,#00d2ff 60%,#006699 100%);
  clip-path:polygon(50% 0,80% 30%,62% 52%,100% 76%,56% 100%,40% 66%,0 50%,32% 28%);
  filter:drop-shadow(0 0 10px rgba(0,220,255,0.8));
  opacity:0.85;
  animation:float 3.5s ease-in-out infinite;
  animation-delay:1.7s;
}
@keyframes float{
  0%,100%{transform:rotate(var(--r)) translateY(0)}
  50%{transform:rotate(var(--r)) translateY(-6px)}
}
.board{
  width:290px;
  height:290px;
  display:grid;
  grid-template-columns:repeat(5,52px);
  grid-template-rows:repeat(5,52px);
  gap:6px;
  justify-content:center;
  align-content:center;
  margin:0 auto;
}

/* CELLS */
.cell{
  width:52px;
  height:52px;
  min-width:52px;
  min-height:52px;
  border-radius:12px;
  overflow:hidden;
  background:radial-gradient(circle at 50% 25%,#2be4ff 0%,#00a8d6 55%,#00688a 100%);
  border:1px solid rgba(0,0,0,.4);
  border-top:1.5px solid #a6f4ff;
  box-shadow:inset 0 -3px 5px rgba(0,30,50,0.8),0 3px 6px rgba(0,0,0,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
}
.cell.scan{
  filter:brightness(1.8);
  box-shadow:0 0 12px rgba(120,220,255,.9);
}
.cell.open,.cell.boom{
  background:#091322;
  border-color:transparent;
  box-shadow:none;
}
.cell.open svg,.cell.boom svg{
  width:85%;
  height:85%;
  display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  animation:starPop 0.25s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
}
@keyframes starPop{
  0%{transform:scale(0) rotate(-20deg);opacity:0}
  55%{transform:scale(1.18) rotate(6deg);opacity:1}
  75%{transform:scale(0.95) rotate(-2deg)}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}
@media (max-width:340px){
  .board-wrap{transform:scale(.86);transform-origin:top center;margin-bottom:-40px}
}

/* PANELS */
.panel{
  margin-top:12px;
  border-radius:14px;
  background:#141a24;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 12px;
  gap:10px;
}
.sel{
  display:flex;
  align-items:center;
  gap:20px;
  background:#0d1219;
  border-radius:12px;
  padding:8px 20px;
}
.sel button{
  background:none;
  border:none;
  color:#8b93a7;
  font-size:20px;
  line-height:1;
  padding:6px 12px;
  border-radius:8px;
  transition:transform .08s;
}
.sel button:active{
  color:#fff;
  background:rgba(80,150,255,.18);
  transform:scale(.9);
}
.sel b{
  color:#fff;
  font-size:16px;
  min-width:16px;
  text-align:center;
}
.sel small{
  color:#8b93a7;
  font-size:12px;
  font-weight:600;
}

/* CONTROLS */
.controls{
  margin-top:12px;
  border-radius:14px;
  background:#141a24;
  padding:12px;
}
.play{
  display:block;
  width:100%;
  height:42px;
  background:#0077ff;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:16px;
  font-weight:800;
  letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(0,119,255,.35);
}
.play:active{transform:scale(.98)}
.back{
  display:block;
  width:90px;
  height:32px;
  background:#962d18;
  border:none;
  border-radius:8px;
  color:#ffd9c9;
  font-size:13px;
  font-weight:700;
  letter-spacing:.5px;
  margin:10px auto 0;
}
.back:active{transform:scale(.96)}

/* ADMIN MODAL & FLOATING BTN */
.admin-trigger{
  position:fixed;
  bottom:12px;
  right:12px;
  z-index:99999;
  background:#ffb400;
  color:#000;
  border:none;
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  box-shadow:0 0 12px rgba(255,180,0,0.6);
}
.admin-modal{
  position:fixed;
  top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(5px);
  z-index:999999;
  display:flex;
  align-items:center;
  justify-content:center;
}
.admin-box{
  background:#141a24;
  border:1.5px solid #00c8ff;
  padding:18px;
  border-radius:16px;
  width:90%;
  max-width:340px;
  text-align:center;
}
.admin-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:6px;
  margin:14px 0;
}
.admin-cell{
  aspect-ratio:1;
  background:#091426;
  border:1px solid #203550;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8b9bb4;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}
.admin-cell.active{
  background:#00c853;
  color:#000;
  border-color:#a6f4ff;
  box-shadow:0 0 8px rgba(0,200,83,0.8);
}
.admin-btn-row{
  display:flex;
  gap:10px;
}
.admin-btn{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  font-size:13px;
}
.admin-btn.save{background:#00c8ff;color:#000;}
.admin-btn.reset{background:#e53935;color:#fff;}
</style>
</head>
<body>

<div class="col">

  <div class="header">
    <div class="logo">
      <span class="w">1</span><span class="b">WIN</span>
    </div>
    <button class="switch" id="switchBtn">Modo Múltiplo</button>
  </div>

  <div class="status idle" id="status">
    <span class="dot"></span><span id="statusTxt">AGUARDANDO SINAL...</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
  </div>

  <div class="panel">
    <div class="sel">
      <button id="tMinus" class="traps-ctrl">‹</button>
      <b id="trapVal">1</b>
      <small>minas</small>
      <button id="tPlus" class="traps-ctrl">›</button>
    </div>
  </div>

  <div class="controls">
    <button class="play" id="playBtn">GERAR SINAL</button>
    <button class="back" id="backBtn">FECHAR</button>
  </div>

</div>

<button class="admin-trigger" id="adminTrigger" onclick="openAdminModal()" hidden>⚙️ Настроить ячейки</button>

<div class="admin-modal" id="adminModal" hidden>
  <div class="admin-box">
    <h3 style="color:#00c8ff;font-size:16px;">Выбери ячейки для видео</h3>
    <div class="admin-grid" id="adminGrid"></div>
    <div class="admin-btn-row">
      <button class="admin-btn reset" onclick="clearCustomSelection()">Сброс</button>
      <button class="admin-btn save" onclick="closeAdminModal()">Сохранить</button>
    </div>
  </div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
  } catch (e) {}
}

var boardEl = document.getElementById('board');
var cells = Array.prototype.slice.call(boardEl.children);
var statusEl = document.getElementById('status');
var statusTxt = document.getElementById('statusTxt');
var trapValEl = document.getElementById('trapVal');
var switchBtn = document.getElementById('switchBtn');
var adminTrigger = document.getElementById('adminTrigger');
var adminModal = document.getElementById('adminModal');
var adminGrid = document.getElementById('adminGrid');
var tMinusEl = document.getElementById('tMinus');
var tPlusEl = document.getElementById('tPlus');
var playBtnEl = document.getElementById('playBtn');
var backBtnEl = document.getElementById('backBtn');

var traps = 1;
var multi = false;
var busy = false;
var FORCE = false;
var customSelectedCells = [];

// Проверка ссылки на секретный ключ (?admin=dev77)
var urlParams = new URLSearchParams(window.location.search);
var isAdmin = (urlParams.get('admin') === 'dev77');
if (isAdmin) {
  adminTrigger.hidden = false;
}

var AC = null;
function getAudioContext() {
  if (!AC) {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) AC = new AudioCtx();
  }
  if (AC && AC.state === 'suspended') {
    AC.resume();
  }
  return AC;
}

function tone(freq, dur, type, gain, delay) {
  try {
    var ctx = getAudioContext();
    if (!ctx) return;
    var t = ctx.currentTime + (delay || 0);
    var osc = ctx.createOscillator();
    var gn = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    gn.gain.setValueAtTime(gain || 0.15, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gn);
    gn.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  } catch (e) {}
}

function hapticLight() {
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  }
}
function hapticSuccess() {
  if (tg && tg.HapticFeedback) {
    try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  }
}

var STAR_SVG = '<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">' +
  '<defs>' +
  '  <linearGradient id="starBase" x1="0%" y1="0%" x2="0%" y2="100%">' +
  '    <stop offset="0%" stop-color="#fff59d"/>' +
  '    <stop offset="25%" stop-color="#ffb300"/>' +
  '    <stop offset="70%" stop-color="#fb8c00"/>' +
  '    <stop offset="100%" stop-color="#d84315"/>' +
  '  </linearGradient>' +
  '  <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">' +
  '    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>' +
  '    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>' +
  '  </linearGradient>' +
  '  <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">' +
  '    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.5"/>' +
  '    <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffb300" flood-opacity="0.7"/>' +
  '  </filter>' +
  '</defs>' +
  '<g filter="url(#starGlow)">' +
  '  <polygon points="50,6 64,34 95,36 71,57 79,88 50,71 21,88 29,57 5,36 36,34" fill="url(#starBase)" stroke="#bf360c" stroke-width="1.2" stroke-linejoin="round"/>' +
  '  <polygon points="50,6 50,71 21,88 29,57 5,36 36,34" fill="#000" opacity="0.14"/>' +
  '  <polygon points="50,6 64,34 50,71" fill="url(#facetLight)"/>' +
  '  <polygon points="50,6 36,34 50,71" fill="#fff" opacity="0.25"/>' +
  '  <polygon points="95,36 71,57 50,71" fill="url(#facetLight)"/>' +
  '  <circle cx="50" cy="48" r="7" fill="#fff" opacity="0.4" filter="blur(2px)"/>' +
  '</g>' +
  '</svg>';

var CROSS_SVG =
  '<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">' +
  '<defs>' +
  '  <linearGradient id="iceBar" x1="0%" y1="0%" x2="100%" y2="100%">' +
  '    <stop offset="0%" stop-color="#ffffff"/>' +
  '    <stop offset="25%" stop-color="#c2f0ff"/>' +
  '    <stop offset="65%" stop-color="#4db8ff"/>' +
  '    <stop offset="100%" stop-color="#1268a8"/>' +
  '  </linearGradient>' +
  '</defs>' +
  '<g transform="rotate(45 50 50)" stroke="#094573" stroke-width="1">' +
  '  <rect x="41" y="10" width="18" height="80" rx="9" fill="url(#iceBar)"/>' +
  '  <rect x="10" y="41" width="80" height="18" rx="9" fill="url(#iceBar)"/>' +
  '  <rect x="46" y="14" width="8" height="72" rx="4" fill="#ffffff" opacity="0.55"/>' +
  '</g>' +
  '</svg>';

function setStatus(mode) {
  if (mode === 'an') {
    statusEl.className = 'status an';
    statusTxt.textContent = 'ANALISANDO COM IA...';
  } else if (mode === 'ok') {
    statusEl.className = 'status ok';
    statusTxt.textContent = 'SINAL CONFIRMADO ✅';
  } else {
    statusEl.className = 'status idle';
    statusTxt.textContent = 'AGUARDANDO SINAL...';
  }
}

function clearBoard() {
  cells.forEach(function (c) {
    c.className = 'cell';
    c.innerHTML = '';
  });
}

function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function bindAction(el, fn) {
  if (!el || !fn) return;
  var lastDown = 0;
  el.addEventListener('pointerdown', function (ev) {
    lastDown = Date.now();
    fn();
  });
  el.addEventListener('click', function (ev) {
    if (Date.now() - lastDown < 350) return;
    fn();
  });
}

function initAdminGrid() {
  adminGrid.innerHTML = '';
  for (var i = 0; i < 25; i++) {
    var d = document.createElement('div');
    d.className = 'admin-cell' + (customSelectedCells.indexOf(i) >= 0 ? ' active' : '');
    d.textContent = (i + 1);
    (function(idx, el){
      el.onclick = function() {
        var pos = customSelectedCells.indexOf(idx);
        if (pos >= 0) {
          customSelectedCells.splice(pos, 1);
          el.classList.remove('active');
        } else {
          customSelectedCells.push(idx);
          el.classList.add('active');
        }
      };
    })(i, d);
    adminGrid.appendChild(d);
  }
}

function openAdminModal() {
  if (!isAdmin) return;
  initAdminGrid();
  adminModal.hidden = false;
  tone(880, 0.08, 'square', 0.18);
  hapticLight();
}

function closeAdminModal() {
  adminModal.hidden = true;
  FORCE = customSelectedCells.length > 0;
  tone(1200, 0.08, 'square', 0.18);
  hapticLight();
}

function clearCustomSelection() {
  customSelectedCells = [];
  initAdminGrid();
  FORCE = false;
}

function onSwitchMode() {
  if (busy) return;
  multi = !multi;
  switchBtn.textContent = multi ? 'Modo Único' : 'Modo Múltiplo';
  tone(multi ? 880 : 520, 0.08, 'triangle', 0.18);
  hapticLight();
}

function onTrapsMinus() {
  if (busy) return;
  traps = Math.max(1, traps - 1);
  trapValEl.textContent = traps;
  tone(420, 0.06, 'sine', 0.1);
  hapticLight();
}

function onTrapsPlus() {
  if (busy) return;
  traps = Math.min(24, traps + 1);
  trapValEl.textContent = traps;
  tone(640, 0.06, 'sine', 0.1);
  hapticLight();
}

function scanBoard(callback) {
  setStatus('an');
  var count = 0;
  var scanTimer = setInterval(function () {
    var idx = Math.floor(Math.random() * cells.length);
    var c = cells[idx];
    c.classList.add('scan');
    setTimeout(function () { c.classList.remove('scan'); }, 140);
    tone(1400, 0.03, 'square', 0.12);
    count++;
  }, 80);
  setTimeout(function () {
    clearInterval(scanTimer);
    callback();
  }, 1600);
}

function revealSingle(trapSet, safeSet) {
  var starIdx;
  if (FORCE && customSelectedCells.length > 0) {
    starIdx = customSelectedCells.slice();
  } else {
    var PICKS_MIN = 3, PICKS_MAX = 5;
    var n = PICKS_MIN + Math.floor(Math.random() * (PICKS_MAX - PICKS_MIN + 1));
    starIdx = shuffle(safeSet.slice()).slice(0, n);
  }
  var seq = starIdx.slice();
  var step = 0;
  function next() {
    if (step >= seq.length) {
      tone(660, 0.12, 'triangle', 0.18, 0);
      tone(880, 0.12, 'triangle', 0.18, 0.08);
      tone(1180, 0.16, 'sine', 0.18, 0.16);
      hapticSuccess();
      setStatus('ok');
      busy = false;
      return;
    }
    var idx = seq[step++];
    var c = cells[idx];
    c.classList.add('open');
    c.innerHTML = STAR_SVG;
    tone(760 + step * 65, 0.10, 'triangle', 0.18);
    hapticLight();
    setTimeout(next, 170);
  }
  next();
}

function revealMulti(trapSet, safeSet) {
  var order = [];
  safeSet.forEach(function (i) { order.push({ i: i, t: 'star' }); });
  trapSet.forEach(function (i) { order.push({ i: i, t: 'trap' }); });
  shuffle(order);
  var step = 0;
  var delay = 30;
  function next() {
    if (step >= order.length) {
      tone(660, 0.12, 'triangle', 0.18, 0);
      tone(880, 0.12, 'triangle', 0.18, 0.08);
      tone(1180, 0.16, 'sine', 0.18, 0.16);
      hapticSuccess();
      setStatus('ok');
      busy = false;
      return;
    }
    var item = order[step++];
    var c = cells[item.i];
    c.classList.add('open');
    if (item.t === 'trap') {
      c.classList.add('boom');
      c.innerHTML = CROSS_SVG;
      tone(220, 0.14, 'sawtooth', 0.2);
      tone(110, 0.20, 'square', 0.25, 0.05);
    } else {
      c.innerHTML = STAR_SVG;
      tone(820 + step * 40, 0.08, 'triangle', 0.16);
    }
    hapticLight();
    setTimeout(next, delay);
  }
  next();
}

function onPlay() {
  if (busy) return;
  busy = true;
  clearBoard();
  hapticLight();
  tone(260, 0.12, 'sawtooth', 0.18);
  tone(320, 0.10, 'sawtooth', 0.18, 0.08);
  scanBoard(function () {
    var pool = [];
    for (var i = 0; i < cells.length; i++) {
      if (!(FORCE && customSelectedCells.indexOf(i) >= 0)) {
        pool.push(i);
      }
    }
    shuffle(pool);
    var trapSet = pool.slice(0, Math.min(traps, pool.length));
    var safeSet = [];
    for (var j = 0; j < cells.length; j++) {
      if (trapSet.indexOf(j) === -1) safeSet.push(j);
    }
    if (multi) {
      revealMulti(trapSet, safeSet);
    } else {
      revealSingle(trapSet, safeSet);
    }
  });
}

function onBack() {
  if (busy) return;
  clearBoard();
  setStatus('idle');
  tone(420, 0.10, 'triangle', 0.18);
  hapticLight();
  if (tg) {
    try { tg.close(); } catch (e) {}
  }
}

bindAction(switchBtn, onSwitchMode);
bindAction(tMinusEl, onTrapsMinus);
bindAction(tPlusEl, onTrapsPlus);
bindAction(playBtnEl, onPlay);
bindAction(backBtnEl, onBack);

setStatus('idle');
</script>
</body>
</html>
